name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LearningTracker.slnx

      - name: Build
        run: dotnet build LearningTracker.slnx -c Release --no-restore

      - name: Test
        run: dotnet test LearningTracker.slnx -c Release --no-build --verbosity normal
